name: Prepare VPN Manager 0.2.7

on:
  push:
    branches: [feature/plasma-widget-0.2.7]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare source and release
        run: |
          python scripts/prepare_widget_0_2_7.py
          python -m py_compile src/vpnctl.py src/vpnadmin.py scripts/build_release.py
          python src/vpnctl.py --self-test
          python scripts/build_release.py --channels stable testing
      - name: Verify release and Plasma package
        run: |
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          v = Path('VERSION').read_text().strip()
          assert v == '0.2.7'
          a = Path(f'dist/vpn-manager-{v}.tar.gz')
          digest = hashlib.sha256(a.read_bytes()).hexdigest()
          for channel in ('stable', 'testing'):
              m = json.loads(Path(f'update/{channel}.json').read_text())
              assert m['version'] == v
              assert m['sha256'] == digest
          with tarfile.open(a, 'r:gz') as tf:
              assert tf.getnames() == ['vpnctl.py', 'vpnadmin.py', 'VERSION']
          text = Path('src/vpnctl.py').read_text()
          assert 'PLASMOID_ID = "com.evgenium.network"' in text
          assert '/usr/local/bin/vpn status --json' in text
          assert '/usr/local/bin/vpn toggle' in text
          print('0.2.7 release OK', digest)
          PY
      - name: Commit prepared 0.2.7
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vpnctl.py VERSION CHANGELOG.md README.md update/stable.json update/testing.json dist/vpn-manager-0.2.7.tar.gz dist/vpn-manager-0.2.7.tar.gz.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'VPN Manager 0.2.7: add Plasma 6 widget'
            git push
          fi
