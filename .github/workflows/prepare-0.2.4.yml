name: Prepare VPN Manager 0.2.4

on:
  push:
    branches:
      - fix/server-port-bypass-table-0.2.4

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare source and release
        run: |
          python scripts/prepare_0_2_4.py
          python -m py_compile src/vpnctl.py src/vpnadmin.py scripts/build_release.py scripts/prepare_0_2_4.py
          python src/vpnctl.py --self-test
          grep -F 'SERVER_BYPASS_TABLE = 51820' src/vpnctl.py
          grep -F 'lookup", str(SERVER_BYPASS_TABLE)' src/vpnctl.py
          python scripts/build_release.py --channels stable testing
      - name: Verify release
        run: |
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          v = Path('VERSION').read_text().strip()
          assert v == '0.2.4'
          archive = Path(f'dist/vpn-manager-{v}.tar.gz')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          for channel in ('stable', 'testing'):
              m = json.loads(Path(f'update/{channel}.json').read_text())
              assert m['version'] == v
              assert m['sha256'] == digest
          with tarfile.open(archive, 'r:gz') as tf:
              assert tf.getnames() == ['vpnctl.py', 'vpnadmin.py', 'VERSION']
          print('0.2.4 release OK', digest)
          PY
      - name: Commit prepared 0.2.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vpnctl.py VERSION CHANGELOG.md README.md update/stable.json update/testing.json dist/vpn-manager-0.2.4.tar.gz dist/vpn-manager-0.2.4.tar.gz.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'VPN Manager 0.2.4: fix server-port physical routing table'
            git push
          fi
