name: Prepare VPN Manager 0.2.8 Plasma hotfix

on:
  push:
    branches: [hotfix/plasma-widget-0.2.8]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Plasma 6 representation hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/vpnctl.py')
          s = p.read_text()
          replacements = [
              ('MANAGER_VERSION = "0.2.7"', 'MANAGER_VERSION = "0.2.8"'),
              ('"Version": "1.0"', '"Version": "1.1"'),
              ('    Plasmoid.toolTipMainText: "Evgenium Network"', '    toolTipMainText: "Evgenium Network"'),
              ('    Plasmoid.toolTipSubText: busy', '    toolTipSubText: busy'),
              ('    Plasmoid.preferredRepresentation: Plasmoid.fullRepresentation', '    preferredRepresentation: fullRepresentation'),
              ('    Plasmoid.fullRepresentation: Item {', '    fullRepresentation: Item {'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match for {old!r}, got {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)

          Path('VERSION').write_text('0.2.8\n')

          readme = Path('README.md').read_text()
          readme = readme.replace('Current stable baseline: **0.2.7**.', 'Current stable baseline: **0.2.8**.', 1)
          Path('README.md').write_text(readme)

          changelog = Path('CHANGELOG.md').read_text()
          entry = '''## 0.2.8\n\n- fix Plasma 6 widget loading: representation and tooltip properties now use the direct `PlasmoidItem` API\n- keep the 0.2.7 widget behavior and local `vpn status --json` / `vpn toggle` contract unchanged\n\n'''
          marker = '# Changelog\n\n'
          if '## 0.2.8' not in changelog:
              changelog = changelog.replace(marker, marker + entry, 1)
          Path('CHANGELOG.md').write_text(changelog)
          PY
      - name: Compile and self-test
        run: |
          python -m py_compile src/vpnctl.py src/vpnadmin.py scripts/build_release.py
          python src/vpnctl.py --self-test
          grep -F '    fullRepresentation: Item {' src/vpnctl.py
          grep -F '    preferredRepresentation: fullRepresentation' src/vpnctl.py
          ! grep -F 'Plasmoid.fullRepresentation: Item {' src/vpnctl.py
          ! grep -F 'Plasmoid.toolTipMainText:' src/vpnctl.py
      - name: Build and verify 0.2.8 release
        run: |
          python scripts/build_release.py --channels stable testing
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          v = Path('VERSION').read_text().strip()
          assert v == '0.2.8'
          archive = Path(f'dist/vpn-manager-{v}.tar.gz')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          for channel in ('stable', 'testing'):
              m = json.loads(Path(f'update/{channel}.json').read_text())
              assert m['version'] == v
              assert m['sha256'] == digest
          with tarfile.open(archive, 'r:gz') as tf:
              assert tf.getnames() == ['vpnctl.py', 'vpnadmin.py', 'VERSION']
          print('0.2.8 release OK', digest)
          PY
      - name: Commit hotfix and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vpnctl.py VERSION README.md CHANGELOG.md update/stable.json update/testing.json dist/vpn-manager-0.2.8.tar.gz dist/vpn-manager-0.2.8.tar.gz.sha256
          git rm .github/workflows/hotfix-0.2.8.yml
          git commit -m 'VPN Manager 0.2.8: fix Plasma 6 widget representation API'
          git push
