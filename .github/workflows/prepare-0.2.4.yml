name: Prepare VPN Manager 0.2.4

on:
  push:
    branches: [fix/server-port-bypass-table-0.2.4]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch 0.2.4
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/vpnctl.py')
          s = p.read_text()
          s = s.replace('MANAGER_VERSION = "0.2.3"', 'MANAGER_VERSION = "0.2.4"', 1)
          s = s.replace(
              'SERVER_BYPASS_MARK = 0x45564E01\nSERVER_BYPASS_RULE_PREF = 50\n',
              'SERVER_BYPASS_MARK = 0x45564E01\nSERVER_BYPASS_RULE_PREF = 50\nSERVER_BYPASS_TABLE = 51820\n',
              1,
          )

          old = '''def _delete_server_bypass_policy_rules() -> None:
              mark = f"0x{SERVER_BYPASS_MARK:08x}/0xffffffff"
              for family in (["/usr/bin/ip"], ["/usr/bin/ip", "-6"]):
                  for _ in range(8):
                      cp = run(
                          family + [
                              "rule", "del",
                              "pref", str(SERVER_BYPASS_RULE_PREF),
                              "fwmark", mark,
                              "lookup", "main",
                          ],
                          check=False, capture=True
                      )
                      if cp.returncode != 0:
                          break


          def _install_server_bypass_policy_rules(enabled: bool) -> None:
              _delete_server_bypass_policy_rules()
              if not enabled:
                  return

              mark = f"0x{SERVER_BYPASS_MARK:08x}/0xffffffff"
              v4 = run(
                  [
                      "/usr/bin/ip", "rule", "add",
                      "pref", str(SERVER_BYPASS_RULE_PREF),
                      "fwmark", mark,
                      "lookup", "main",
                  ],
                  check=False, capture=True
              )
              if v4.returncode != 0:
                  fail("Не удалось поставить IPv4 policy rule для SERVER ports:\\n" + (v4.stderr or ""))

              v6 = run(
                  [
                      "/usr/bin/ip", "-6", "rule", "add",
                      "pref", str(SERVER_BYPASS_RULE_PREF),
                      "fwmark", mark,
                      "lookup", "main",
                  ],
                  check=False, capture=True
              )
              if v6.returncode != 0:
                  warn("IPv6 SERVER-port policy rule не установлен: " + (v6.stderr or "").strip())
          '''

          new = '''def _delete_server_bypass_policy_rules() -> None:
              mark = f"0x{SERVER_BYPASS_MARK:08x}/0xffffffff"
              # Удаляем и старую 0.2.3 rule -> main, и новую rule -> dedicated table.
              for famflag in ("-4", "-6"):
                  for table in ("main", str(SERVER_BYPASS_TABLE)):
                      for _ in range(8):
                          cp = run(
                              [
                                  "/usr/bin/ip", famflag, "rule", "del",
                                  "pref", str(SERVER_BYPASS_RULE_PREF),
                                  "fwmark", mark,
                                  "lookup", table,
                              ],
                              check=False, capture=True
                          )
                          if cp.returncode != 0:
                              break
                  run(
                      [
                          "/usr/bin/ip", famflag, "route", "flush",
                          "table", str(SERVER_BYPASS_TABLE),
                      ],
                      check=False, capture=True
                  )


          def _physical_routes_from_main(family: int) -> tuple[str | None, list[dict]]:
              famflag = "-4" if family == 4 else "-6"
              cp = run(
                  ["/usr/bin/ip", "-j", famflag, "route", "show", "table", "main"],
                  check=False, capture=True
              )
              if cp.returncode != 0:
                  return None, []
              try:
                  routes = json.loads(cp.stdout or "[]")
              except json.JSONDecodeError:
                  return None, []
              if not isinstance(routes, list):
                  return None, []

              defaults = [
                  r for r in routes
                  if isinstance(r, dict)
                  and r.get("dst", "default") == "default"
                  and r.get("dev")
                  and r.get("dev") != TUN_NAME
                  and r.get("type", "unicast") == "unicast"
              ]
              if not defaults:
                  return None, []

              def metric(route: dict) -> int:
                  try:
                      return int(route.get("metric", 0))
                  except (TypeError, ValueError):
                      return 0

              chosen = min(defaults, key=metric)
              iface = str(chosen["dev"])
              selected = [
                  r for r in routes
                  if isinstance(r, dict)
                  and r.get("dev") == iface
                  and r.get("type", "unicast") == "unicast"
              ]
              # Connected/link routes first, default last, so a gateway is reachable
              # when we install the default route into the dedicated table.
              selected.sort(key=lambda r: (r.get("dst", "default") == "default", metric(r)))
              return iface, selected


          def _populate_server_bypass_table(family: int) -> str | None:
              famflag = "-4" if family == 4 else "-6"
              iface, routes = _physical_routes_from_main(family)
              run(
                  [
                      "/usr/bin/ip", famflag, "route", "flush",
                      "table", str(SERVER_BYPASS_TABLE),
                  ],
                  check=False, capture=True
              )
              if not iface:
                  return None

              for route in routes:
                  dst = str(route.get("dst", "default"))
                  cmd = [
                      "/usr/bin/ip", famflag, "route", "replace",
                      "table", str(SERVER_BYPASS_TABLE), dst,
                  ]
                  gateway = route.get("gateway")
                  if gateway:
                      cmd += ["via", str(gateway)]
                  cmd += ["dev", iface]
                  prefsrc = route.get("prefsrc")
                  if prefsrc:
                      cmd += ["src", str(prefsrc)]
                  metric = route.get("metric")
                  if metric is not None:
                      cmd += ["metric", str(metric)]
                  cp = run(cmd, check=False, capture=True)
                  if cp.returncode != 0:
                      fail(
                          f"Не удалось скопировать физический маршрут в table {SERVER_BYPASS_TABLE}: "
                          + (cp.stderr or "").strip()
                      )
              return iface


          def _verify_server_bypass_route(family: int, iface: str) -> None:
              famflag = "-4" if family == 4 else "-6"
              target = "1.1.1.1" if family == 4 else "2606:4700:4700::1111"
              cp = run(
                  [
                      "/usr/bin/ip", famflag, "route", "get", target,
                      "mark", f"0x{SERVER_BYPASS_MARK:08x}",
                  ],
                  check=False, capture=True
              )
              out = (cp.stdout or "").strip()
              if cp.returncode != 0 or TUN_NAME in out or f"dev {iface}" not in out:
                  fail(
                      "SERVER-port policy route не обходит TUN. "
                      f"Ожидался dev {iface}, получено: {out or (cp.stderr or '').strip()}"
                  )


          def _install_server_bypass_policy_rules(enabled: bool) -> None:
              _delete_server_bypass_policy_rules()
              if not enabled:
                  return

              mark = f"0x{SERVER_BYPASS_MARK:08x}/0xffffffff"

              iface4 = _populate_server_bypass_table(4)
              if not iface4:
                  fail("Не найден физический IPv4 default route для SERVER-port bypass.")
              v4 = run(
                  [
                      "/usr/bin/ip", "-4", "rule", "add",
                      "pref", str(SERVER_BYPASS_RULE_PREF),
                      "fwmark", mark,
                      "lookup", str(SERVER_BYPASS_TABLE),
                  ],
                  check=False, capture=True
              )
              if v4.returncode != 0:
                  fail("Не удалось поставить IPv4 policy rule для SERVER ports:\\n" + (v4.stderr or ""))
              _verify_server_bypass_route(4, iface4)

              # IPv6 — best effort: на машине может вообще не быть физического IPv6 default.
              iface6 = _populate_server_bypass_table(6)
              if iface6:
                  v6 = run(
                      [
                          "/usr/bin/ip", "-6", "rule", "add",
                          "pref", str(SERVER_BYPASS_RULE_PREF),
                          "fwmark", mark,
                          "lookup", str(SERVER_BYPASS_TABLE),
                      ],
                      check=False, capture=True
                  )
                  if v6.returncode == 0:
                      _verify_server_bypass_route(6, iface6)
                  else:
                      warn("IPv6 SERVER-port policy rule не установлен: " + (v6.stderr or "").strip())
          '''

          # Dedent the source snippets because they are nested in this workflow script.
          import textwrap
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if old not in s:
              raise SystemExit('0.2.3 policy-routing block not found')
          s = s.replace(old, new, 1)

          old_after = '''    if args.cmd == "internal-after-update":
              sync_system_files()
              # Новый код сам решит свой safe core.
              core_update(settings)
              ok("Обновление manager полностью применено.")
              return 0
          '''
          new_after = '''    if args.cmd == "internal-after-update":
              sync_system_files()
              # Мигрируем активную 0.2.3 rule -> main без выключения VPN.
              if service_active() and nft_exists() and read_server_ports(settings):
                  info("Мигрирую SERVER-port bypass на выделенную физическую routing table...")
                  install_guard(settings)
              # Новый код сам решит свой safe core.
              core_update(settings)
              ok("Обновление manager полностью применено.")
              return 0
          '''
          old_after = textwrap.dedent(old_after)
          new_after = textwrap.dedent(new_after)
          if old_after not in s:
              raise SystemExit('internal-after-update block not found')
          s = s.replace(old_after, new_after, 1)
          p.write_text(s)

          Path('VERSION').write_text('0.2.4\n')

          ch = Path('CHANGELOG.md')
          c = ch.read_text()
          entry = '''## 0.2.4

- fix SERVER-port bypass: 0.2.3 incorrectly sent the mark back to `main`, whose preferred default is still `xraytun`
- build dedicated routing table 51820 from the physical interface routes
- send marked established server replies to table 51820 instead of `main`
- verify the marked route resolves to the physical interface and never to `xraytun`
- migrate an active 0.2.3 installation during `vpn update` without requiring VPN off/on

'''
          if '## 0.2.4' not in c:
              c = c.replace('# Changelog\n\n', '# Changelog\n\n' + entry, 1)
              ch.write_text(c)

          r = Path('README.md')
          t = r.read_text().replace('Current stable baseline: **0.2.3**.', 'Current stable baseline: **0.2.4**.', 1)
          r.write_text(t)
          PY

          python -m py_compile src/vpnctl.py src/vpnadmin.py scripts/build_release.py
          python src/vpnctl.py --self-test
          grep -F 'SERVER_BYPASS_TABLE = 51820' src/vpnctl.py
          grep -F 'lookup", str(SERVER_BYPASS_TABLE)' src/vpnctl.py
          python scripts/build_release.py --channels stable testing

      - name: Verify release
        run: |
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          v = Path('VERSION').read_text().strip()
          assert v == '0.2.4'
          a = Path(f'dist/vpn-manager-{v}.tar.gz')
          digest = hashlib.sha256(a.read_bytes()).hexdigest()
          for channel in ('stable', 'testing'):
              m = json.loads(Path(f'update/{channel}.json').read_text())
              assert m['version'] == v
              assert m['sha256'] == digest
          with tarfile.open(a, 'r:gz') as tf:
              assert tf.getnames() == ['vpnctl.py', 'vpnadmin.py', 'VERSION']
          print('0.2.4 release OK', digest)
          PY

      - name: Commit prepared 0.2.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vpnctl.py VERSION CHANGELOG.md README.md update/stable.json update/testing.json dist/vpn-manager-0.2.4.tar.gz dist/vpn-manager-0.2.4.tar.gz.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'VPN Manager 0.2.4: fix server-port physical routing table'
            git push
          fi
