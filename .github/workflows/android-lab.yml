name: Android lab build
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', '.github/workflows/android-lab.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;27.3.13750724'
      - name: Build all supported ABIs and run unit tests
        run: ./android/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lab-test-results
          path: android/.build/strongswan/src/frontends/android/app/build/test-results/
      # A stable signing key and complete source/license bundle are required
      # before publishing an APK. CI intentionally uploads test results only.
