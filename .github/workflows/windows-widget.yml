name: Windows native widget prototype
on:
  push:
    paths: ['windows/widgets/**', '.github/workflows/windows-widget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Compile provider and validate card state
        shell: powershell
        run: |
          & .\windows\widgets\package.ps1 -Output "$env:RUNNER_TEMP\widget-prototype"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-widget-PROTOTYPE-not-for-installation
          path: |
            ${{ runner.temp }}/widget-prototype/*.msix
            ${{ runner.temp }}/widget-prototype/README.txt
