name: Verify Plasma Widget 0.2.7

on:
  push:
    branches: [feature/plasma-widget-0.2.7]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final widget patch
        run: python scripts/postpatch_widget_0_2_7.py
      - name: Compile and self-test
        run: |
          python -m py_compile src/vpnctl.py src/vpnadmin.py scripts/build_release.py
          python src/vpnctl.py --self-test
      - name: Rebuild deterministic release
        run: python scripts/build_release.py --channels stable testing
      - name: Verify release contract
        run: |
          python -c "import hashlib,json,tarfile; from pathlib import Path; v=Path('VERSION').read_text().strip(); assert v=='0.2.7'; a=Path(f'dist/vpn-manager-{v}.tar.gz'); d=hashlib.sha256(a.read_bytes()).hexdigest(); ms=[json.loads(Path(f'update/{c}.json').read_text()) for c in ('stable','testing')]; assert all(m['version']==v and m['sha256']==d for m in ms); tf=tarfile.open(a,'r:gz'); assert tf.getnames()==['vpnctl.py','vpnadmin.py','VERSION']; tf.close(); print('release OK',d)"
          grep -F 'PLASMOID_ID = "com.evgenium.network"' src/vpnctl.py
          grep -F 'vpn status --json' src/vpnctl.py
          grep -F 'vpn toggle' src/vpnctl.py
          grep -F 'last_active' src/vpnctl.py
      - name: Commit rebuilt release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vpnctl.py update/stable.json update/testing.json dist/vpn-manager-0.2.7.tar.gz dist/vpn-manager-0.2.7.tar.gz.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'VPN Manager 0.2.7: finalize Plasma widget'
            git push
          fi
