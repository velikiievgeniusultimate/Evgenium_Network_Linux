name: Test Evgenium VPN
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies for isolated tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap charon-systemd strongswan-swanctl nftables conntrack iproute2 curl openssl qml-qt6 qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtqml qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qt-labs-platform
          sudo useradd --system --no-create-home vpn-xray
          python -m pip install -r server/panel/requirements.txt
      - name: Build reproducibly and test
        run: |
          bash -n install.sh
          python -m py_compile src/*.py server/*.py server/panel/*.py scripts/build_release.py scripts/test-unified-policy.py
          python scripts/build_release.py --channels stable testing
          git diff --exit-code -- src/vpnctl.py dist/ update/
          python src/vpnctl.py --self-test
          python src/evgenium_gui.py --self-test
          python -m unittest discover -s tests -v
          python -m unittest discover -s server/panel/tests -v
          # Qt 6.4 reports valid outer-component bindings as unqualified warnings.
          /usr/lib/qt6/bin/qmllint --unqualified info src/evgenium_gui.qml src/evgenium_widget.qml
      - name: Legacy upgrade and independent repair in disposable filesystem
        run: sudo python3 scripts/test-upgrade-sandbox.py
      - name: Fetch and verify pinned local routing engine
        run: |
          python - <<'PY'
          import importlib.util,hashlib,zipfile,io,pathlib
          spec=importlib.util.spec_from_file_location('manager','src/vpnctl.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          name,url,digest,dgst=m.github_xray_asset();blob=m.http_get(url)
          if digest is None and dgst:digest=m.parse_checksum_text(m.http_get(dgst))
          assert digest and hashlib.sha256(blob).hexdigest()==digest
          with zipfile.ZipFile(io.BytesIO(blob)) as z:pathlib.Path('/tmp/evg-policy-xray').write_bytes(z.read('xray'))
          pathlib.Path('/tmp/evg-policy-xray').chmod(0o755)
          PY
      - name: Real isolated routing and fail-closed tests
        run: |
          sudo env EVG_TEST_XRAY=/tmp/evg-policy-xray python3 scripts/test-unified-policy.py
          sudo python3 scripts/test-dns-transition.py
          sudo python3 scripts/test-local-dns-guard.py
