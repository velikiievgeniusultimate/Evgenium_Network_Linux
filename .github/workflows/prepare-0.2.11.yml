name: Prepare VPN Manager 0.2.11 standalone GUI

on:
  push:
    branches: [feature/standalone-gui-0.2.11]
    paths:
      - 'scripts/prepare_0_2_11.py'
      - 'src/evgenium_gui.py'
      - 'src/evgenium_gui.qml'
      - '.github/workflows/prepare-0.2.11.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/standalone-gui-0.2.11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply 0.2.11 source changes
        run: python scripts/prepare_0_2_11.py
      - name: Compile and offline self-tests
        run: |
          python -m py_compile src/vpnctl.py src/vpnadmin.py src/evgenium_gui.py scripts/build_release.py
          python src/vpnctl.py --self-test
          python src/evgenium_gui.py --self-test
      - name: Verify embedded standalone GUI matches source
        run: |
          python - <<'PY'
          import ast, base64
          from pathlib import Path
          tree=ast.parse(Path('src/vpnctl.py').read_text())
          vals={}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0], ast.Name):
                  name=node.targets[0].id
                  if name in {'STANDALONE_GUI_PY_B64','STANDALONE_GUI_QML_B64'}:
                      vals[name]=ast.literal_eval(node.value)
          assert base64.b64decode(vals['STANDALONE_GUI_PY_B64']) == Path('src/evgenium_gui.py').read_bytes()
          assert base64.b64decode(vals['STANDALONE_GUI_QML_B64']) == Path('src/evgenium_gui.qml').read_bytes()
          print('embedded GUI assets match source')
          PY
      - name: Build deterministic release
        run: python scripts/build_release.py --channels stable testing
      - name: Verify backward-compatible release shape
        run: |
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          v=Path('VERSION').read_text().strip()
          archive=Path(f'dist/vpn-manager-{v}.tar.gz')
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          with tarfile.open(archive,'r:gz') as tf:
              assert tf.getnames()==['vpnctl.py','vpnadmin.py','VERSION']
          for channel in ('stable','testing'):
              m=json.loads(Path(f'update/{channel}.json').read_text())
              assert m['version']==v and m['sha256']==digest
          print('release shape OK', digest)
          PY
      - name: Commit prepared 0.2.11
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vpnctl.py VERSION CHANGELOG.md dist update
          git diff --cached --check
          git commit -m 'VPN Manager 0.2.11: standalone Evgenium Network GUI'
          git push origin HEAD:feature/standalone-gui-0.2.11
