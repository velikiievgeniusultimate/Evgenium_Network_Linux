name: Test Evgenium VPN
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies for isolated tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap charon-systemd strongswan-swanctl nftables conntrack iproute2 curl openssl qml-qt6 qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtqml qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates
          sudo useradd --system --no-create-home vpn-xray
          python -m pip install -r server/panel/requirements.txt
      - name: Build reproducibly and test
        run: |
          bash -n install.sh
          python -m py_compile src/*.py server/*.py server/panel/*.py scripts/build_release.py scripts/test-unified-policy.py
          python scripts/build_release.py --channels stable testing
          git diff --exit-code -- src/vpnctl.py dist/ update/
          python src/vpnctl.py --self-test
          python src/evgenium_gui.py --self-test
          python -m unittest discover -s tests -v
          python -m unittest discover -s server/panel/tests -v
          python -m unittest discover -s server/connect/tests -v
          # Qt 6.4 reports valid outer-component bindings as unqualified warnings.
          /usr/lib/qt6/bin/qmllint --unqualified info src/evgenium_gui.qml
      - name: Legacy upgrade and independent repair in disposable filesystem
        run: sudo python3 scripts/test-upgrade-sandbox.py
      - name: Token-client upgrades, retained protection and rollback
        run: python3 scripts/test-token-upgrade.py
      - name: Fetch and verify pinned local routing engine
        run: |
          # This job runs on x86_64. Use the official asset directly so shared
          # runner IPs do not depend on the unauthenticated GitHub API quota.
          archive="$RUNNER_TEMP/Xray-linux-64.zip"
          curl --fail --location --retry 3 --max-time 90 --silent --show-error \
            https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip -o "$archive"
          printf '%s  %s\n' 8195d909f1109b8f3d99eefe401a3c451d7bf4af71f24d3815420f77e5dd2a40 "$archive" | sha256sum -c
          python - "$archive" <<'PY'
          import pathlib, sys, zipfile
          binary = pathlib.Path('/tmp/evg-policy-xray')
          with zipfile.ZipFile(sys.argv[1]) as package:
              binary.write_bytes(package.read('xray'))
          binary.chmod(0o755)
          PY
      - name: Real isolated routing and fail-closed tests
        run: |
          sudo env EVG_TEST_XRAY=/tmp/evg-policy-xray python3 scripts/test-unified-policy.py
          sudo python3 scripts/test-dns-transition.py
          sudo python3 scripts/test-local-dns-guard.py
          sudo python3 scripts/test-relay-reconnect-route.py

  publish-linux:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Publish the tested stable Linux package when the version changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet HEAD^1 HEAD -- VERSION; then exit 0; fi
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          archive="vpn-manager-$version.tar.gz"
          (cd dist && sha256sum --check "$archive.sha256")
          digest=$(sha256sum "dist/$archive" | cut -d' ' -f1)
          url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/dist/$archive"
          jq -e --arg v "$version" --arg h "$digest" --arg url "$url" \
            '.channel == "stable" and .version == $v and .sha256 == $h and .url == $url' update/stable.json
          notes="$RUNNER_TEMP/linux-release.md"
          awk '/^## / { if (++n == 2) exit; next } n == 1' CHANGELOG.md > "$notes"
          test -s "$notes"
          title=$(sed -n '1s/^## //p' CHANGELOG.md)
          [[ "$title" == "Linux $version" || "$title" == "Linux $version "* ]]

          existing=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f1)
          [[ -z "$existing" || "$existing" == "$GITHUB_SHA" ]]
          if info=$(gh release view "$tag" --json isDraft,targetCommitish); then
            draft=$(jq -r '.isDraft' <<< "$info")
            if [[ "$draft" == true ]]; then
              [[ "$(jq -r '.targetCommitish' <<< "$info")" == "$GITHUB_SHA" ]]
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "$title" --notes-file "$notes"
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" "dist/$archive" "dist/$archive.sha256" --clobber
          fi
          verify=$(mktemp -d)
          gh release download "$tag" --pattern "$archive" --pattern "$archive.sha256" --dir "$verify"
          cmp "dist/$archive" "$verify/$archive"
          cmp "dist/$archive.sha256" "$verify/$archive.sha256"
          if [[ "$draft" == true ]]; then gh release edit "$tag" --draft=false; fi
