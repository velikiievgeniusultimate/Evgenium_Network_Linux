name: Prepare VPN Manager 0.2.15

on:
  push:
    branches: [feature/fedora-kde-0.2.15]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fedora-kde-0.2.15
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare release sources and archive
        run: python scripts/prepare_0_2_15.py
      - name: Validate installer and manager
        run: |
          bash -n install.sh
          python -m py_compile src/vpnctl.py src/vpnadmin.py src/evgenium_gui.py scripts/build_release.py
          python src/vpnctl.py --self-test
          python src/evgenium_gui.py --self-test
          grep -F 'DISTRO="fedora"' install.sh
          grep -F 'qt6-qtdeclarative-devel' install.sh
          grep -F '/usr/bin/qml-qt6' src/evgenium_gui.py
          grep -F '/usr/lib64/qt6/bin/qml' src/evgenium_gui.py
      - name: Verify embedded GUI and manifests
        run: |
          python - <<'PY'
          import ast, base64, hashlib, json, tarfile
          from pathlib import Path
          tree=ast.parse(Path('src/vpnctl.py').read_text())
          vals={}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0], ast.Name):
                  if node.targets[0].id == 'STANDALONE_GUI_PY_B64':
                      vals[node.targets[0].id]=ast.literal_eval(node.value)
          assert base64.b64decode(vals['STANDALONE_GUI_PY_B64']) == Path('src/evgenium_gui.py').read_bytes()
          v=Path('VERSION').read_text().strip()
          archive=Path(f'dist/vpn-manager-{v}.tar.gz')
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          for channel in ('stable','testing'):
              m=json.loads(Path(f'update/{channel}.json').read_text())
              assert m['version']==v
              assert m['sha256']==digest
              assert m['xray_version']=='26.7.28'
          with tarfile.open(archive,'r:gz') as tf:
              assert tf.getnames()==['vpnctl.py','vpnadmin.py','VERSION']
          print('0.2.15 release contract OK', digest)
          PY
      - name: Commit generated release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION CHANGELOG.md README.md src/evgenium_gui.py src/vpnctl.py dist update
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'VPN Manager 0.2.15: Fedora KDE support'
            git push origin HEAD:feature/fedora-kde-0.2.15
          fi
