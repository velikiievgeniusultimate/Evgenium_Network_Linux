name: EvgeniumTunnel prototype
on:
  push:
    branches: [main]
    paths: ['transport/evgenium-tunnel/**', '.github/workflows/evgenium-tunnel.yml']
  pull_request:
    branches: [main]
    paths: ['transport/evgenium-tunnel/**', '.github/workflows/evgenium-tunnel.yml']
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transport/evgenium-tunnel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -run '^$' -fuzz FuzzFrames -fuzztime 10s
      - name: Build Linux transports
        run: |
          mkdir -p build
          for arch in amd64 arm64 riscv64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o build/evgenium-tunnel-linux-$arch .
          done
          (cd build && sha256sum evgenium-tunnel-linux-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: evgenium-tunnel-experimental
          path: transport/evgenium-tunnel/build/
