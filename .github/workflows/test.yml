name: Test VPN Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate installer syntax
        run: |
          bash -n install.sh
          grep -F 'update/stable.json' install.sh
          grep -F 'vpn update' install.sh
      - name: Compile and self-test
        run: |
          python -m py_compile src/vpnctl.py src/vpnadmin.py src/evgenium_gui.py scripts/build_release.py
          python src/vpnctl.py --self-test
          python src/evgenium_gui.py --self-test
          grep -F '"process": apps' src/vpnctl.py
          grep -F 'DIRECT_SOCKS_PORT = 18443' src/vpnctl.py
          grep -F 'Применяю новые DIRECT-правила к активному VPN' src/vpnctl.py
      - name: Validate standalone GUI contract
        run: |
          grep -F 'PLASMOID_ID = "com.evgenium.network"' src/vpnctl.py
          grep -F 'sub.add_parser("toggle")' src/vpnctl.py
          grep -F 'pst.add_argument("--json"' src/vpnctl.py
          grep -F 'pwsub.add_parser("install")' src/vpnctl.py
          grep -F 'pgsub.add_parser("install")' src/vpnctl.py
          grep -F '/usr/local/bin/vpn status --json' src/vpnctl.py
          grep -F '/usr/local/bin/vpn toggle' src/vpnctl.py
          grep -F '/usr/local/bin/evgenium-network --detach' src/vpnctl.py
          grep -F 'cmd_gui_install(settings)' src/vpnctl.py
          grep -F 'evgenium-network.desktop' src/vpnctl.py
          grep -F '/api/running' src/evgenium_gui.py
          grep -F '/api/action' src/evgenium_gui.py
          grep -F 'Запущены сейчас' src/evgenium_gui.qml
          grep -F 'target: String(modelData.exe || modelData.name || "")' src/evgenium_gui.qml
          python - <<'PY'
          import ast, base64
          from pathlib import Path
          tree=ast.parse(Path('src/vpnctl.py').read_text())
          vals={}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0], ast.Name):
                  name=node.targets[0].id
                  if name in {'STANDALONE_GUI_PY_B64','STANDALONE_GUI_QML_B64'}:
                      vals[name]=ast.literal_eval(node.value)
          assert base64.b64decode(vals['STANDALONE_GUI_PY_B64']) == Path('src/evgenium_gui.py').read_bytes()
          assert base64.b64decode(vals['STANDALONE_GUI_QML_B64']) == Path('src/evgenium_gui.qml').read_bytes()
          print('embedded GUI assets match source')
          PY
      - name: Lint standalone Qt Quick UI
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts
          set +e
          /usr/lib/qt6/bin/qmllint src/evgenium_gui.qml > /tmp/qmllint.log 2>&1
          status=$?
          cat /tmp/qmllint.log
          if [[ $status -ne 0 ]]; then
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error file=src/evgenium_gui.qml::$line"
            done < /tmp/qmllint.log
          fi
          exit $status
      - name: Validate nftables server-port rules
        run: |
          sudo apt-get install -y -qq nftables
          python - <<'PY' > /tmp/vpn-guard.nft
          import importlib.util
          spec = importlib.util.spec_from_file_location('vpnctl', 'src/vpnctl.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print(mod.render_guard_rules(943, {25565}, {19132}))
          PY
          sudo nft -c -f /tmp/vpn-guard.nft
          ip rule help 2>&1 | grep -F 'fwmark'
      - name: Validate dedicated server bypass table
        run: |
          grep -F 'SERVER_BYPASS_TABLE = 51820' src/vpnctl.py
          grep -F '"lookup", str(SERVER_BYPASS_TABLE)' src/vpnctl.py
          grep -F '_verify_server_bypass_route(4, iface4)' src/vpnctl.py
          python - <<'PY'
          from pathlib import Path
          s = Path('src/vpnctl.py').read_text()
          start = s.index('def _install_server_bypass_policy_rules')
          end = s.index('def build_config(', start)
          block = s[start:end]
          assert '"lookup", "main"' not in block
          assert 'SERVER_BYPASS_TABLE' in block
          print('dedicated bypass table wiring OK')
          PY
      - name: Verify current release and manifests
        run: |
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          v=Path('VERSION').read_text().strip()
          archive=Path(f'dist/vpn-manager-{v}.tar.gz')
          assert archive.is_file()
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          for channel in ('stable','testing'):
              m=json.loads(Path(f'update/{channel}.json').read_text())
              assert m['channel']==channel
              assert m['version']==v
              assert m['sha256']==digest
          with tarfile.open(archive,'r:gz') as tf:
              assert tf.getnames()==['vpnctl.py','vpnadmin.py','VERSION']
          print('release + manifests OK', digest)
          PY
