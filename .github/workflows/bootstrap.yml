name: Bootstrap repository

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src
          cat .bootstrap/vpnctl.b64.* | base64 -d > src/vpnctl.py
          cat .bootstrap/vpnadmin.b64.* | base64 -d > src/vpnadmin.py
          chmod +x src/vpnctl.py src/vpnadmin.py

      - name: Validate source
        run: |
          python -m py_compile src/vpnctl.py src/vpnadmin.py scripts/build_release.py
          python src/vpnctl.py --self-test

      - name: Build stable and testing manifests
        run: python scripts/build_release.py --channels stable testing

      - name: Verify release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          v=Path('VERSION').read_text().strip()
          p=Path(f'dist/vpn-manager-{v}.tar.gz')
          stable=json.loads(Path('update/stable.json').read_text())
          testing=json.loads(Path('update/testing.json').read_text())
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          assert got == stable['sha256'] == testing['sha256']
          assert stable['version'] == testing['version'] == v
          with tarfile.open(p, 'r:gz') as tf:
              assert tf.getnames() == ['vpnctl.py','vpnadmin.py','VERSION']
          print('release verification OK', got)
          PY

      - name: Commit generated project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bootstrap VPN Manager 0.2.1 source and update channel'
          git push origin HEAD:main
