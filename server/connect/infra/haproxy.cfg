global
  maxconn 512
  user nobody
  group nogroup
  tune.bufsize 32768
  ssl-default-bind-options ssl-min-ver TLSv1.2
  stats socket /run/evgenium-connect-front/admin.sock mode 600 level admin

defaults
  mode tcp
  timeout connect 5s
  timeout client 24h
  timeout server 24h
  option clitcpka
  option srvtcpka

frontend acme_http
  bind 0.0.0.0:80
  mode http
  timeout client 30s
  acl portal_host hdr(host) -i connect.velikiievgenius.com panel.velikiievgenius.com
  acl acme_path path_beg /.well-known/acme-challenge/
  http-request deny unless portal_host
  http-request deny if !METH_GET !METH_HEAD
  http-request redirect scheme https code 301 unless acme_path
  default_backend acme_files

backend acme_files
  mode http
  timeout server 30s
  server files 127.0.0.1:9083

frontend shared_https
  bind 0.0.0.0:9444
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend portal_tls if { req.ssl_sni -i connect.velikiievgenius.com }
  use_backend owner_panel_tls if { req.ssl_sni -i panel.velikiievgenius.com }
  default_backend existing_poco

backend existing_poco
  server original 127.0.0.1:443

backend portal_tls
  server portal 127.0.0.1:9443 send-proxy-v2

frontend portal_https
  bind 127.0.0.1:9443 accept-proxy ssl crt /etc/evgenium-connect/tls.pem alpn h2,http/1.1
  mode http
  timeout client 30s
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-For %[src]
  default_backend portal_app

backend portal_app
  mode http
  timeout server 30s
  server gunicorn 127.0.0.1:9082

# Owner control plane is reachable on HSVDS without any VPN/backbone dependency.
backend owner_panel_tls
  server panel 127.0.0.1:9445 send-proxy-v2

frontend owner_panel_https
  bind 127.0.0.1:9445 accept-proxy ssl crt /etc/evgenium-panel/tls.pem alpn h2,http/1.1
  mode http
  timeout client 30s
  http-request set-header X-Forwarded-Proto https
  http-request set-header X-Forwarded-For %[src]
  default_backend owner_panel_app

backend owner_panel_app
  mode http
  timeout server 30s
  server panel 127.0.0.1:9081
