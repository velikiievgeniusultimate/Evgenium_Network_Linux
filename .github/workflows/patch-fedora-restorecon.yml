name: Patch Fedora restorecon scope
on:
  push:
    branches: [feature/fedora-kde-0.2.15]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/fedora-kde-0.2.15
      - name: Patch installer
        run: |
          python scripts/patch_fedora_restorecon.py
          bash -n install.sh
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install.sh
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Installer: scope Fedora SELinux relabeling to E-VPN files'
            git push origin HEAD:feature/fedora-kde-0.2.15
          fi
