name: Prepare VPN Manager 0.2.10 Plasma settings button

on:
  push:
    branches: [feature/plasma-settings-button-0.2.10]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply 0.2.10 source changes
        run: |
          python scripts/prepare_0_2_10.py
          python -m py_compile src/vpnctl.py src/vpnadmin.py scripts/build_release.py
          python src/vpnctl.py --self-test

      - name: Verify Plasma configure action contract
        run: |
          grep -F 'Plasmoid.hasConfigurationInterface: true' src/vpnctl.py
          grep -F 'plasmoid.internalAction("configure")' src/vpnctl.py
          grep -F 'plasmoid.action("configure")' src/vpnctl.py
          grep -F 'root.errorText = "Plasma не создала действие настроек"' src/vpnctl.py
          grep -F 'text: "E-VPN"' src/vpnctl.py

      - name: Build deterministic release
        run: |
          python scripts/build_release.py --channels stable testing

      - name: Verify release and manifests
        run: |
          python - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          v = Path('VERSION').read_text().strip()
          assert v == '0.2.10'
          archive = Path(f'dist/vpn-manager-{v}.tar.gz')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          for channel in ('stable', 'testing'):
              manifest = json.loads(Path(f'update/{channel}.json').read_text())
              assert manifest['version'] == v
              assert manifest['sha256'] == digest
          with tarfile.open(archive, 'r:gz') as tf:
              assert tf.getnames() == ['vpnctl.py','vpnadmin.py','VERSION']
          print('0.2.10 release OK', digest)
          PY

      - name: Commit prepared 0.2.10
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vpnctl.py VERSION CHANGELOG.md update/stable.json update/testing.json dist/vpn-manager-0.2.10.tar.gz dist/vpn-manager-0.2.10.tar.gz.sha256
          git commit -m 'VPN Manager 0.2.10: fix Plasma settings button'
          git push
